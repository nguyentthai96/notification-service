server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

# Notification service configuration
app:
  notification:
    queue:
      batch-size: 10
      poll-interval-ms: 5000
      max-retries: 3
      base-retry-delay-seconds: 30
      cleanup-after-days: 30
    channels:
      email:
        enabled: true
      sms:
        enabled: false
      push:
        enabled: false
      ott:
        enabled: false
    mail:
      from: ${MAIL_FROM:noreply@example.com}
      from-name: ${MAIL_FROM_NAME:Notification Service}
    # Phase 2 — SMS (Twilio)
    sms:
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
    # Phase 2 — Push (FCM)
    push:
      fcm:
        credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
    # Phase 2 — OTT (Telegram)
    ott:
      telegram:
        bot-token: ${TELEGRAM_BOT_TOKEN:}
        webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    # Phase 2 — Kafka (optional plug-and-play)
    kafka:
      enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        group-id: notification-service-group
        concurrency: 3
    # Phase 2 — gRPC (optional plug-and-play)
    grpc:
      enabled: ${NOTIFICATION_GRPC_ENABLED:false}

# gRPC server port
grpc:
  server:
    port: 9090

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Resilience4j — circuit breaker per notification channel
resilience4j:
  circuitbreaker:
    instances:
      emailCircuitBreaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
      smsCircuitBreaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
      pushCircuitBreaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
      ottCircuitBreaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED

# Logging
logging:
  level:
    com.ntt.notificationservice: DEBUG
    org.springframework.mail: INFO
