server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

# Notification service configuration
app:
  notification:
    queue:
      batch-size: 10
      poll-interval-ms: 5000
      max-retries: 3
      base-retry-delay-seconds: 30
      cleanup-after-days: 30
    channels:
      email:
        enabled: true
      sms:
        enabled: false
      push:
        enabled: false
      ott:
        enabled: false
    mail:
      from: ${MAIL_FROM:noreply@example.com}
      from-name: ${MAIL_FROM_NAME:Notification Service}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      emailCircuitBreaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED

# Logging
logging:
  level:
    com.ntt.notificationservice: DEBUG
    org.springframework.mail: INFO
